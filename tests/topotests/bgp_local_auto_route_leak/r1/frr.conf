log stdout
!
frr defaults datacenter
hostname r1
!
! Local auto route leak needs no underlay, no L3VNI and no peers -
! three tenant VRFs on one box, matched purely by EVPN route-targets.
!
! Process-wide defaults: both directions on
router bgp 65000
 bgp router-id 10.255.0.1
 !
 address-family l2vpn evpn
  local-auto-route-leak-export
  local-auto-route-leak-import
 exit-address-family
!
router bgp 65000 vrf blue
 bgp router-id 10.255.0.1
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  route-target both 65000:100
 exit-address-family
!
router bgp 65000 vrf red
 bgp router-id 10.255.0.1
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  route-target import 65000:100
  route-target export 65000:200
 exit-address-family
!
router bgp 65000 vrf green
 bgp router-id 10.255.0.1
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  route-target import 65000:200
  ! explicit off - overrides the process-wide default
  local-auto-route-leak-import disable
 exit-address-family
!
