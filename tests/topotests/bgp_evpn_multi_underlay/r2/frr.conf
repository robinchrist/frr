log stdout
debug zebra vxlan
debug bgp zebra
!
frr defaults datacenter
hostname r2
!
interface r2-eth0
 ip address 192.168.1.2/24
!
interface r2-eth1
 ip address 192.168.2.2/24
!
router bgp 65002 vrf underlay-red
 bgp router-id 192.168.1.2
 no bgp ebgp-requires-policy
 neighbor 192.168.1.1 remote-as 65001
 neighbor 192.168.1.1 timers 3 10
 neighbor 192.168.1.1 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 192.168.1.1 activate
  vxlan-underlay
 exit-address-family
!
router bgp 65002 vrf underlay-blue
 bgp router-id 192.168.2.2
 no bgp ebgp-requires-policy
 neighbor 192.168.2.1 remote-as 65001
 neighbor 192.168.2.1 timers 3 10
 neighbor 192.168.2.1 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 192.168.2.1 activate
  vxlan-underlay
 exit-address-family
!
router bgp 65002
 bgp router-id 192.168.1.2
 !
 address-family l2vpn evpn
  vlan-based-evi red-evi
   underlay-vrf underlay-red
   origination-l2vni 100
   route-target both 65000:100
  exit-evi
  vlan-based-evi blue-evi
   underlay-vrf underlay-blue
   origination-l2vni 200
   route-target both 65000:200
  exit-evi
  ! Cross-underlay import: this EVI has no VNI/underlay of its own and
  ! imports the routes of BOTH underlays' EVIs purely via manual RTs
  ! (shared-route-table semantics)
  vlan-based-evi import-both
   route-target import 65000:100
   route-target import 65000:200
  exit-evi
 exit-address-family
!
