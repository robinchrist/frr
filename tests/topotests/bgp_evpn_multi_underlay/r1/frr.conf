log stdout
debug zebra vxlan
debug bgp zebra
!
frr defaults datacenter
hostname r1
!
interface r1-eth0
 ip address 192.168.1.1/24
!
interface r1-eth1
 ip address 192.168.2.1/24
!
! Underlay instance "red": hosts the VTEP for VNI 100
router bgp 65001 vrf underlay-red
 bgp router-id 192.168.1.1
 no bgp ebgp-requires-policy
 neighbor 192.168.1.2 remote-as 65002
 neighbor 192.168.1.2 timers 3 10
 neighbor 192.168.1.2 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 192.168.1.2 activate
  vxlan-underlay
 exit-address-family
!
! Underlay instance "blue": hosts the VTEP for VNI 200
router bgp 65001 vrf underlay-blue
 bgp router-id 192.168.2.1
 no bgp ebgp-requires-policy
 neighbor 192.168.2.2 remote-as 65002
 neighbor 192.168.2.2 timers 3 10
 neighbor 192.168.2.2 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 192.168.2.2 activate
  vxlan-underlay
 exit-address-family
!
! EVIs (tenant: default VRF), each bound to its own underlay
router bgp 65001
 bgp router-id 192.168.1.1
 !
 address-family l2vpn evpn
  vlan-based-evi red-evi
   underlay-vrf underlay-red
   origination-l2vni 100
   route-target both 65000:100
  exit-evi
  vlan-based-evi blue-evi
   underlay-vrf underlay-blue
   origination-l2vni 200
   route-target both 65000:200
  exit-evi
 exit-address-family
!
