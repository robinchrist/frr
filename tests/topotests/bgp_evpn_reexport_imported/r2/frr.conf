log stdout
!
frr defaults datacenter
hostname r2
!
vrf blue
 vni 200
exit-vrf
!
interface r2-eth0
 ip address 192.168.1.2/24
!
! underlay: default VRF
router bgp 65002
 bgp router-id 192.168.1.2
 no bgp ebgp-requires-policy
 neighbor 192.168.1.1 remote-as 65001
 neighbor 192.168.1.1 timers 3 10
 neighbor 192.168.1.1 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 192.168.1.1 activate
  vxlan-underlay
 exit-address-family
!
! tenant blue: imports r1's routes (65000:100) and re-originates them as
! its OWN type-5s with the rewritten RT set 65000:999 (override, external
! only). Note: no `advertise ipv4 unicast` - the explicit re-export path
! does not depend on the generic type-5 origination knob.
router bgp 65002 vrf blue
 bgp router-id 192.168.1.2
 !
 address-family l2vpn evpn
  origination-l3vni 200
  route-target import 65000:100
  re-export-imported
   route-target 65000:999
   mode override
   scope external-only
  exit
 exit-address-family
!
