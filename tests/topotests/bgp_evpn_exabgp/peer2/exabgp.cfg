neighbor 192.0.2.1 {
    router-id 192.0.2.3;
    local-address 192.0.2.3;
    local-as 65003;
    peer-as 65001;
    family {
		l2vpn evpn;
	}

    announce {
        evpn {
            # Type-3 (IMET) for VNI 200 - different RT, must NOT be imported
            # into the import-only VRF/EVI on r1
            multicast rd 192.0.2.3:200 ethernet-tag 0 ip 192.0.2.3 next-hop 192.0.2.3 extended-community [ target:65000:200 ];
            # Type-2 (MAC/IP) host route with the non-imported RT
            mac rd 192.0.2.3:200 ethernet-tag 0 mac 02:42:0a:00:02:0a ip 10.0.2.10 label 200 next-hop 192.0.2.3 extended-community [ target:65000:200 ];
        }
    }
}
