neighbor 192.0.2.1 {
    router-id 192.0.2.2;
    local-address 192.0.2.2;
    local-as 65002;
    peer-as 65001;
    family {
		l2vpn evpn;
	}

    announce {
        evpn {
            # Type-3 (IMET) for VNI 100
            multicast rd 192.0.2.2:100 ethernet-tag 0 ip 192.0.2.2 next-hop 192.0.2.2 extended-community [ target:65000:100 ];
            # Type-2 (MAC/IP) host routes in the 10.0.1.0/24 "tenant"
            mac rd 192.0.2.2:100 ethernet-tag 0 mac 02:42:0a:00:01:0a ip 10.0.1.10 label 100 next-hop 192.0.2.2 extended-community [ target:65000:100 ];
            mac rd 192.0.2.2:100 ethernet-tag 0 mac 02:42:0a:00:01:0b ip 10.0.1.11 label 100 next-hop 192.0.2.2 extended-community [ target:65000:100 ];
        }
    }
}
