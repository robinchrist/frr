debug zebra vxlan
debug zebra kernel
debug bgp zebra
!
frr defaults datacenter
hostname r1
!
interface r1-eth0
 ip address 192.0.2.1/24
!
router bgp 65001
 bgp router-id 192.0.2.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 65002
 neighbor 192.0.2.2 timers 3 10
 neighbor 192.0.2.2 timers connect 1
 neighbor 192.0.2.3 remote-as 65003
 neighbor 192.0.2.3 timers 3 10
 neighbor 192.0.2.3 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.3 activate
  ! Import-only EVI: no underlay, no origination VNI, no dataplane at all.
  ! It imports MAC/IP + IMET routes purely via its manual import RT.
  vlan-based-evi import-only
   route-target import 65000:100
  exit-evi
 exit-address-family
!
! Import-only tenant VRF: no origination-l3vni, no VXLAN constructs in the
! dataplane (only a bare VRF device so the instance gets a vrf_id). It imports
! the MAC/IP routes' host prefixes purely via its manual import RT; nothing
! may be programmed into zebra (no live L3VNI).
router bgp 65001 vrf blue
 bgp router-id 192.0.2.1
 !
 address-family l2vpn evpn
  route-target import 65000:100
 exit-address-family
!
